[project]
name = "workflow-factory"
version = "0.1.0"
description = "Deterministic apprentice that replays taught lessons across Windows desktop apps"
authors = [
    { name = "alejaMig21", email = "108048421+alejaMig21@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "mcp>=2.3.0",
    "numpy>=2.5.5",
]

[project.scripts]
workflow-factory = "workflow_factory.cli:main"

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "playwright>=1.65.2",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live and not web'"
markers = [
    "live: real agent-desktop smoke tests, opt-in with -m live",
    "web: headless-browser tests of the built editor, opt-in with -m web",
]

[tool.ruff]
line-length = 140
extend-exclude = ["web", ".scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["workflow_factory"]
known-local-folder = ["fake_desktop"]
